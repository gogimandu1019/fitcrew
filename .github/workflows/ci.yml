name: CI

on:
  push:
  pull_request:

jobs:
  db:
    name: DB 규칙 테스트 (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: supabase/tests/package-lock.json }
      - run: npm ci
        working-directory: supabase/tests
      - run: npm test
        working-directory: supabase/tests

  app:
    name: 앱 타입체크 · 린트 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npx expo lint
        working-directory: app
      - run: npm test
        working-directory: app
